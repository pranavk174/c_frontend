<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">

      <!-- Icon -->
      <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-red-500/10 flex items-center justify-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-10 h-10 text-red-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8.111 16.404A5 5 0 0112 7a5 5 0 013.889 9.404M5 19h14"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4l16 16"
          />
        </svg>
      </div>

      <!-- Heading -->
      <h1 class="text-3xl font-bold text-white mb-3">
        You're Offline
      </h1>

      <!-- Description -->
      <p class="text-slate-400 leading-relaxed mb-8">
        It looks like your internet connection has been lost.
        Please reconnect to continue using the application.
      </p>

      <!-- Button -->
      <button
        onclick="window.location.reload()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition"
      >
        Try Again
      </button>

      <!-- Status -->
      <div class="mt-6 flex items-center justify-center gap-2 text-sm text-slate-500">
        <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
        Offline Mode
      </div>

    </div>
  </div>

</body>
</html>
